name: Compilar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk MediControl.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MediControl-APK
          path: MediControl.apk
          retention-days: 30
